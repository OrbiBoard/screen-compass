<!DOCTYPE html>
<!-- PYLXY 260103 screen.compass 应用层主窗口 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>屏幕罗盘</title>
    <!-- Fix path to remixicon -->
    <link rel="stylesheet" href="../../../OrbiBoard/src/renderer/remixicon-local.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="root" id="root">
      <div id="compass-container" style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        <div class="circle-bg" id="circleBg"></div>
        <div class="sectors" id="sectors"></div>
        <div class="ring" id="ring"></div>
        <div class="hbg" id="hTrayBg"></div>
        <div class="htray" id="hTray"></div>
        <!-- Center button -->
        <div class="center-btn" id="center">
          <i class="ri-compass-3-line"></i>
        </div>
      </div>
      <div id="drag-hint" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding: 4px 12px; border-radius: 4px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.2s;">
        点击主按钮收起即可开始拖动
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>

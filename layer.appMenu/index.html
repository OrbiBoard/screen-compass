<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>应用</title>
    <link rel="stylesheet" href="../../../renderer/remixicon-local.css" />
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <div class="root">
      <div class="topbar">
        <div class="title"><i class="ri-apps-line" style="font-size: 18px;"></i><span>应用</span></div>
        <div style="display:flex; gap:4px; align-items: center;">
          <button id="collapse" class="win-control" title="收起"><i class="ri-close-line"></i></button>
        </div>
      </div>
      <div class="content">
        <div class="grid-wrap">
          <div class="arrow up" id="arrowUp"><i class="ri-arrow-up-s-line"></i></div>
          <div class="grid-scroll" id="gridScroll">
            <div class="grid" id="grid"></div>
          </div>
          <div class="arrow down" id="arrowDown"><i class="ri-arrow-down-s-line"></i></div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
